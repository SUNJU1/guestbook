# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontrainer-ksj

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crksj.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_97DCDA409DE04E80AD4DE8F6A102BEA8 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_C7BCA6BE356449149EEFC9B533DDEC6D }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crksj.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_97DCDA409DE04E80AD4DE8F6A102BEA8 }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontrainer-ksj'
          slot-name: 'Production'
          images: 'crksj.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_97DCDA409DE04E80AD4DE8F6A102BEA8 }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_689B5B66D5F044FD888C0CF6BB846C44 }}